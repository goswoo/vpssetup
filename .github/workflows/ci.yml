name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: find . -type f -name '*.sh' -not -path './dist/*' -exec bash -n {} \;
      - name: ShellCheck
        run: shellcheck vpssetup.sh install.sh lib/*.sh scripts/*.sh tests/*.sh
      - name: Sandbox functional tests
        run: bash tests/run.sh
      - name: Build release archive
        run: bash scripts/build-release.sh

